# This configuration demonstrates how Nginx can act as a reverse proxy
# for an agent service, handling SSL (if configured), host headers, etc.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Define an upstream for your agent service
    # The 'agent_worker' here refers to the service name in docker-compose.yml
    # If the agent exposed an HTTP API, this is how Nginx would forward requests to it.
    upstream agent_backend {
        # This assumes your agent service listens on port 8000.
        # For this prototype, agent_worker is a background task, so this is illustrative.
        server agent_worker:8000;
    }

    server {
        listen 80;
        server_name localhost; # Replace with your domain in production

        # Example: Basic health check endpoint for the proxy itself
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
            # For a real agent HTTP service, you would proxy here:
            # proxy_pass http://agent_backend;
            # proxy_set_header Host $host;
            # proxy_set_header X-Real-IP $remote_addr;
            # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Example: Serve a simple static file to confirm Nginx is running
        location = /index.html {
            add_header Content-Type text/html;
            return 200 '<h1>Hello from Nginx Proxy!</h1>';
        }

        # Example: Error logging
        error_log /var/log/nginx/error.log warn;
        access_log /var/log/nginx/access.log combined;
    }

    # You would add another server block here for HTTPS (port 443)
    # requiring SSL certificates:
    # server {
    #     listen 443 ssl;
    #     server_name your.domain.com;
    #
    #     ssl_certificate /etc/nginx/certs/your.domain.com.crt;
    #     ssl_certificate_key /etc/nginx/certs/your.domain.com.key;
    #
    #     location / {
    #         proxy_pass http://agent_backend;
    #         # ... SSL specific headers
    #     }
    # }
}
